<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vocalization Comparison</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      width: 100%;
      height: 100%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .section {
      flex: 1;
      padding: 1.23rem; /*20px;*/
      box-sizing: border-box;
      min-width: 0; /* Add this line */
    }
    /* left panel */
    .section:nth-child(1) {
      background: #f8e9d2;
    }
    /* right panel */
    .section:nth-child(2) {
     /* display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;*/
      background: #e0eaf5;
    }
    .title {
      text-align: center;
      font-size: 1.5rem; /*24px;*/
      margin-bottom: 4%; /*16px;*/
    }
    .context {
      text-align: center;
      margin-bottom: 0px;
    }
    .context button {
      display: inline-flex;
      align-items: center;
      margin: 0.5rem; /*8px;*/
      padding: 0.625rem 1.25rem; /*10px 20px;*/
      font-size: 1rem; /*16px;*/
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #fff;
      transition: background 0.2s;
    }
    .context button:hover {
      background: #f0f0f0;
    }
    .context button span {
      margin-left: 6px; /* space for icon */
      font-size: 1rem; /*16px;*/
    }
    .spectrogram {
      width: 100%;
      height: 35%;
      border: 1px solid #aaa;
      background-size: cover;
      background-position: center;
      margin-bottom: 4%;
    }
    .spectrogram img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Or 'cover' */
    }
    #spectrogram-container {
      position: relative;
      left: 50px;  /* for frequecy axis, so it is eaqual to the width of frequency*/
      width: 95%;
      height: 35%;
      border: 1px solid #FFF;
      max-width: 100%
    }
    #spectrogramCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      max-width: 100%
    }
    #frequency-axis {
      position: absolute;
      top: 0;
      left: -50px; /* Adjust based on desired label width */
      width: 50px;
      height: 100%;
    }
    #button-container{  
      width: 37%;
      height: 13%;    
      background: #e0eaf5;
      margin-top:4%;
    }
    .button {
      padding: 0.625rem 1.25rem;
      font-size: 1rem;
      margin-top: 4%;
      cursor: pointer;
    }
	/* Modal (Pop-up Window) Styles */
        .modal {
            display: none; /* Hidden by default */
            position: absolute; /* Stay in place */
            z-index: 1; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            background-color: rgba(0,0,0,0.8); /* Black background with opacity */
            justify-content: center;
            align-items: center;
        }

        /* Modal Content (Video container) */
        .modal-content {
            position: relative;
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 381px; /*80%; Adjust width as needed 
            max-width: 800px;*/
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        /* The Video element itself within the modal */
        #videoPlayer {
            width: 381px; /*100%;*/
            height: 677px; /*auto;*/
        }

        /* The Close Button */
        .close {
            color: #aaa;
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 2;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
}
    
  </style>
</head>
<body>
  <div class="container">
    <!-- Bat Vocalization Panel -->
    <div class="section">
      <div class="title">Bat Vocalization</div>
      <div class="context">
        <button id="strawsAudioButton">
          Straws <span>🔊</span>
        </button>
	<button id="strawsVideoButton" onclick="openModal('Righty Calling for Food.mp4')">Video <span>🎥</span></button>
      </div>
      <div class="spectrogram" id="strawsSpectrogram">
        <img src = "Righty Calling for Food.png">
      </div>
      <div class="context">
        <button id="rodsAudioButton">
          Rods <span>🔊</span>
        </button>
	<button id="rodsVideoButton" onclick="openModal('Queen Peach Vocalization.mp4')">Video <span>🎥</span></button>
      </div>
      <div class="spectrogram" id="fightingSpectrogram">
        <img src = "sg10449-1-fighting.png">
      </div>
    </div>
    
    <!-- Human Vocalization Panel -->
    <div class="section">
      <div class="title">Human Vocalization</div>
      <div class="spectrogram" id="humanSpectrogram">
        <img src = "hello_world.png">
      </div>
      <div class="title">Real Time Spectrogram</div>
      <div class="context">
        <button id="startBtn">Start Microphone</button>
        <button id="stopButton">Stop</button>
        <button id="clearButton">Clear</button>
      </div>
      <div id="spectrogram-container">
        <canvas id="spectrogramCanvas"></canvas>
        <canvas id="frequency-axis"></canvas>
      </div>     
    </div>
	
	<!-- The Modal/Pop-up -->
    <div id="videoModal" class="modal">
        
        <!-- Modal content -->
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <video id="videoPlayer" controls>
                Your browser does not support the video tag.
            </video>
        </div>

    </div>

  <script src="comparison.js"></script>
  <script src="real_time_axis.js"></script>
</body>
</html>
