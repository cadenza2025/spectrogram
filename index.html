<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vocalization Comparison</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      width: 100%;
      height: 100%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .section {
      flex: 1;
      padding: 1.23rem; /*20px;*/
      box-sizing: border-box;
      min-width: 0; /* Add this line */
    }
    /* left panel */
    .section:nth-child(1) {
      background: #f8e9d2;
    }
    /* right panel */
    .section:nth-child(2) {
      display: flex;
      flex-direction: column;
     /* justify-content: center;
      align-items: center;
      font-family: sans-serif;*/
      background: #e0eaf5;
    }
    .title {
      text-align: center;
      font-size: 1.5rem; /*24px;*/
      margin-bottom: 4%; /*16px;*/
    }
    .context {
      text-align: center;
      margin-bottom: 0px;
    }
    .context button {
      display: inline-flex;
      align-items: center;
      margin: 0.5rem; /*8px;*/
      padding: 0.625rem 1.25rem; /*10px 20px;*/
      font-size: 1rem; /*16px;*/
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #fff;
      transition: background 0.2s;
    }
    .context button:hover {
      background: #f0f0f0;
    }
    .context button span {
      margin-left: 6px; /* space for icon */
      font-size: 1rem; /*16px;*/
    }
    .spectrogram {
      width: 100%;
      height: 35%;
      border: 1px solid #aaa;
      background-size: cover;
      background-position: center;
      margin-bottom: 4%;
    }
    .spectrogram img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Or 'cover' */
    }
    #spectrogram-container {
      position: relative;
    /*   left: 50px;  for frequecy axis, so it is eaqual to the width of frequency*/
      width: 95%;
      height: 35%;
      border: 1px solid #FFF;
      max-width: 100%
    }
    #spectrogramCanvas {
      position: absolute;
      top: 0;
      left: 50px;
      width: calc(100% - 50px);
      height: 100%;
      max-width: 100%
      z-index:1
    }
    #frequency-axis {
      position: absolute;
      top: 0;
      left: 0; /* Adjust based on desired label width */
      width: 50px;
      height: 100%;
    }
    #button-container{  
      width: 37%;
      height: 13%;    
      background: #e0eaf5;
      margin-top:4%;
    }
    .button {
      padding: 0.625rem 1.25rem;
      font-size: 1rem;
      margin-top: 4%;
      cursor: pointer;
    }
}
    
  </style>
</head>
<body>
  <div class="container">
    <!-- Bat Vocalization Panel -->
    <div class="section">
      <div class="title">Bat Vocalization</div>
      <div class="context">
        <button id="feedingButton">
          Feeding <span>🔊</span>
        </button>
      </div>
      <div class="spectrogram" id="feedingSpectrogram">
        <img src = "sg10006-0-feeding.png">
      </div>
      <div class="context">
        <button id="fightingButton">
          Fighting <span>🔊</span>
        </button>
      </div>
      <div class="spectrogram" id="fightingSpectrogram">
        <img src = "sg10449-1-fighting.png">
      </div>
    </div>
    
    <!-- Human Vocalization Panel -->
    <div class="section">
      <div class="title">Human Vocalization</div>
      <div class="spectrogram" id="humanSpectrogram">
        <img src = "hello_world.png">
      </div>
      <div class="title">Real Time Spectrogram</div>
      <div class="context">
        <button id="startBtn">Start Microphone</button>
        <button id="stopButton">Stop</button>
        <button id="clearButton">Clear</button>
      </div>
      <div id="spectrogram-container">
        <canvas id="spectrogramCanvas"></canvas>
        <canvas id="frequency-axis"></canvas>
      </div>     
    </div>

  <script src="comparison.js"></script>
  <script src="real_time_axis.js"></script>
</body>
</html>
